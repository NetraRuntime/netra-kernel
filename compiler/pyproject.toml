[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-compiler"
version = "0.2.0"
description = "Deterministic ahead-of-time compiler for specialized Netra engines"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netra-compile = "netra_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netra_compiler*"]
