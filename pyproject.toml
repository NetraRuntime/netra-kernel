[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-kernel"
version = "0.3.0.dev0"
description = "Relocatable AMDGCN kernels with pluggable inference-engine adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NetraRuntime"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
sglang = ["torch>=2.8"]
test = ["pytest>=8", "build>=1.2", "ruff>=0.16"]

[project.scripts]
netra-kernel = "netra_kernel.kernel_cli:main"
netra-sglang = "netra_kernel.cli:main"

[project.entry-points."netra.inference_engines"]
sglang = "netra_kernel.sglang.engine:adapter"

[project.entry-points."sglang.srt.plugins"]
netra = "netra_kernel.sglang.plugin:register"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = ["netra_kernel*"]

[tool.setuptools.package-data]
netra_kernel = [
  "assets/**/*.json",
  "assets/**/*.so",
  "assets/**/*.hsaco",
  "assets/**/*.py",
  "assets/**/*.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests/package"]
addopts = "-ra"
