<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Exact-shape gfx950 kernel mechanisms</title>
  <desc id="desc">Six rows connect each kernel speedup to the dataflow or parallelism change that produced it.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title { font: 700 26px Inter, Arial, sans-serif; fill: #57534e; }
    .sub { font: 500 18px Inter, Arial, sans-serif; fill: #716d66; }
    .head { font: 700 18px Inter, Arial, sans-serif; fill: #716d66; letter-spacing: 1px; }
    .name { font: 700 21px Inter, Arial, sans-serif; fill: #20201e; }
    .detail { font: 500 16px Inter, Arial, sans-serif; fill: #625e58; }
    .speed { font: 700 29px Inter, Arial, sans-serif; fill: #078f78; }
    .us { font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34322f; }
  </style>
  <text x="72" y="68" class="title">Six kernels, four recurring ideas</text>
  <text x="72" y="106" class="sub">Exact captured shapes on gfx950 · operation timings, not whole-server multipliers</text>

  <text x="78" y="157" class="head">OPERATION</text>
  <text x="430" y="157" class="head">BEFORE</text>
  <text x="790" y="157" class="head">WHAT CHANGED</text>
  <text x="1450" y="157" class="head" text-anchor="end">SPEEDUP</text>

  <g transform="translate(60 180)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">Argmax · M16 × 248,320</text><text x="24" y="67" class="detail">semantic max key</text>
    <text x="370" y="42" class="us">16 workgroups · 56.304 µs</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">2,048 stage-one waves</text><text x="745" y="65" class="detail">128 chunks/row, then reduce partial keys</text>
    <text x="1390" y="57" class="speed" text-anchor="end">7.08×</text>
  </g>
  <g transform="translate(60 292)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">Long-prefix attention · M12</text><text x="24" y="67" class="detail">49,152-token prefix</text>
    <text x="370" y="42" class="us">serial sequence · 1.108661 ms</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">split sequence + stable merge</text><text x="745" y="65" class="detail">parallel (m, l, o) partials · bit exact</text>
    <text x="1390" y="57" class="speed" text-anchor="end">4.38×</text>
  </g>
  <g transform="translate(60 404)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">GQA8 target attention</text><text x="24" y="67" class="detail">native E4M3 prefix KV</text>
    <text x="370" y="42" class="us">per-query KV reads · 185.722 µs</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">share KV across four Q heads</text><text x="745" y="65" class="detail">512 threads · 32 KiB LDS · no scratch</text>
    <text x="1390" y="57" class="speed" text-anchor="end">2.21×</text>
  </g>
  <g transform="translate(60 516)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">M12 causal convolution</text><text x="24" y="67" class="detail">width 4 · D8192</text>
    <text x="370" y="42" class="us">generic layout · 44.860 µs</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">compile the physical strides</text><text x="745" y="65" class="detail">33 VGPR · no LDS/scratch · bit exact</text>
    <text x="1390" y="57" class="speed" text-anchor="end">2.07×</text>
  </g>
  <g transform="translate(60 628)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">MoE SiLU + FP8 quant</text><text x="24" y="67" class="detail">9 routes × width 512</text>
    <text x="370" y="42" class="us">two launches · 5.523 µs</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">delete the tensor boundary</text><text x="745" y="65" class="detail">exact BF16 rounding + E4M3 per-128</text>
    <text x="1390" y="57" class="speed" text-anchor="end">1.99×</text>
  </g>
  <g transform="translate(60 740)">
    <rect width="1480" height="100" rx="18" fill="#ffffff" stroke="#dedad3"/>
    <text x="24" y="38" class="name">GDN K0 verification</text><text x="24" y="67" class="detail">B64 · M12 · K128/V128</text>
    <text x="370" y="42" class="us">full-state output · 186.6225 µs</text>
    <path d="M680 50h65" stroke="#a9a49c" stroke-width="3" marker-end="url(#a)"/>
    <text x="745" y="35" class="name">do not write dead state</text><text x="745" y="65" class="detail">≈805 MiB avoided · 119.1815 µs</text>
    <text x="1390" y="57" class="speed" text-anchor="end">1.57×</text>
  </g>

  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a9a49c"/></marker></defs>
  <text x="800" y="880" class="sub" text-anchor="middle">Remove bytes · reuse native grouping · expose waves · freeze the exact contract</text>
</svg>
