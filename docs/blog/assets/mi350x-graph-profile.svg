<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Profile of the Qwen3.6 decode graph on one MI350X</title>
  <desc id="desc">A repeated graph timeline and ranked bars show MoE, GDN, and attention as the three largest measured kernel families.</desc>
  <rect width="1600" height="820" fill="#ffffff"/>
  <style>
    .title { font: 700 26px Inter, Arial, sans-serif; fill: #57534e; }
    .sub { font: 500 19px Inter, Arial, sans-serif; fill: #716d66; }
    .panel { font: 700 25px Inter, Arial, sans-serif; fill: #20201e; }
    .label { font: 600 20px Inter, Arial, sans-serif; fill: #34322f; }
    .value { font: 700 20px Inter, Arial, sans-serif; fill: #20201e; }
    .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #716d66; }
  </style>

  <text x="72" y="68" class="title">The graph, not the operator list, chose the work</text>
  <text x="72" y="106" class="sub">Representative batch-128 trace · 690 graph replays in 10 seconds · one AMD Instinct MI350X</text>

  <rect x="60" y="145" width="1480" height="238" rx="24" fill="#ffffff" stroke="#dedad3" stroke-width="2"/>
  <text x="94" y="191" class="panel">Repeated captured decode steps</text>
  <text x="94" y="221" class="sub">The same families recur in every replay; sampling stays visible after the captured body.</text>
  <g transform="translate(95 254)">
    <g>
      <rect x="0" y="0" width="188" height="30" rx="7" fill="#1681b8"/><rect x="188" y="0" width="73" height="30" fill="#0a9d82"/><rect x="261" y="0" width="57" height="30" fill="#6e2ab0"/><rect x="318" y="0" width="44" height="30" fill="#d8d3ca"/><rect x="367" y="0" width="25" height="30" rx="7" fill="#de9d00"/>
      <rect x="410" y="0" width="188" height="30" rx="7" fill="#1681b8"/><rect x="598" y="0" width="73" height="30" fill="#0a9d82"/><rect x="671" y="0" width="57" height="30" fill="#6e2ab0"/><rect x="728" y="0" width="44" height="30" fill="#d8d3ca"/><rect x="777" y="0" width="25" height="30" rx="7" fill="#de9d00"/>
      <rect x="820" y="0" width="188" height="30" rx="7" fill="#1681b8"/><rect x="1008" y="0" width="73" height="30" fill="#0a9d82"/><rect x="1081" y="0" width="57" height="30" fill="#6e2ab0"/><rect x="1138" y="0" width="44" height="30" fill="#d8d3ca"/><rect x="1187" y="0" width="25" height="30" rx="7" fill="#de9d00"/>
      <rect x="1230" y="0" width="148" height="30" rx="7" fill="#1681b8"/>
    </g>
    <g transform="translate(0 52)" opacity="0.88">
      <rect x="0" y="0" width="188" height="20" rx="5" fill="#1681b8"/><rect x="188" y="0" width="73" height="20" fill="#0a9d82"/><rect x="261" y="0" width="57" height="20" fill="#6e2ab0"/><rect x="318" y="0" width="44" height="20" fill="#d8d3ca"/><rect x="367" y="0" width="25" height="20" rx="5" fill="#de9d00"/>
      <rect x="410" y="0" width="188" height="20" rx="5" fill="#1681b8"/><rect x="598" y="0" width="73" height="20" fill="#0a9d82"/><rect x="671" y="0" width="57" height="20" fill="#6e2ab0"/><rect x="728" y="0" width="44" height="20" fill="#d8d3ca"/><rect x="777" y="0" width="25" height="20" rx="5" fill="#de9d00"/>
      <rect x="820" y="0" width="188" height="20" rx="5" fill="#1681b8"/><rect x="1008" y="0" width="73" height="20" fill="#0a9d82"/><rect x="1081" y="0" width="57" height="20" fill="#6e2ab0"/><rect x="1138" y="0" width="44" height="20" fill="#d8d3ca"/><rect x="1187" y="0" width="25" height="20" rx="5" fill="#de9d00"/>
    </g>
    <text x="0" y="112" class="tiny">captured model graph</text>
    <text x="1178" y="112" class="tiny">sampling outside capture</text>
  </g>

  <rect x="60" y="412" width="1480" height="340" rx="24" fill="#ffffff" stroke="#dedad3" stroke-width="2"/>
  <text x="94" y="458" class="panel">Measured time by hot family</text>
  <text x="94" y="488" class="sub">Aggregate time across the layers in one representative replay; bar scale begins at zero.</text>

  <text x="95" y="548" class="label">FP8 routed MoE · 40 layers</text>
  <rect x="430" y="523" width="850" height="34" rx="10" fill="#1681b8"/>
  <text x="1300" y="548" class="value">5.506 ms</text>

  <text x="95" y="612" class="label">Packed recurrent GDN · 30 layers</text>
  <rect x="430" y="587" width="329" height="34" rx="10" fill="#0a9d82"/>
  <text x="779" y="612" class="value">2.134 ms</text>

  <text x="95" y="676" class="label">FP8-KV attention · 10 layers</text>
  <rect x="430" y="651" width="254" height="34" rx="10" fill="#6e2ab0"/>
  <text x="704" y="676" class="value">1.648 ms</text>

  <text x="95" y="728" class="tiny">Outside graph: argmax 76.5 µs/step · large add/neg support kernels ≈131 µs/step</text>
  <text x="800" y="792" class="sub" text-anchor="middle">MoE first, then GDN, attention, and the exposed sampling tail.</text>
</svg>
