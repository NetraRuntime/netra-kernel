<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Three dataflow transformations behind the MI350X kernel stack</title>
  <desc id="desc">Three horizontal diagrams explain Netra's routed MoE boundary fusion, grouped-query attention sharing and sequence splitting, and GDN state liveness optimization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#a8a29e"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:1.6px;fill:#78716c}
      .title{font-size:26px;font-weight:650;fill:#57534e}.sub{font-size:18px;fill:#78716c}
      .panel-title{font-size:25px;font-weight:700;fill:#292524}.panel-sub{font-size:17px;fill:#78716c}
      .node{font-size:17px;font-weight:650;fill:#292524}.small{font-size:15px;fill:#57534e}
      .metric{font-size:22px;font-weight:750;fill:#0f766e}.note{font-size:15px;fill:#78716c}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="64" y="64" class="sans eyebrow">AFTER OPTIMIZATION · ROCM · GFX950 · EXACT-SHAPE CONTRACTS</text>
  <text x="64" y="118" class="sans title">Optimize the dataflow before the instruction stream</text>
  <text x="64" y="154" class="sans sub">The winning kernels remove a boundary, exploit model structure, or expose parallel work, then preserve that choice through graph replay.</text>

  <g transform="translate(64 202)">
    <rect width="1472" height="238" rx="22" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="28" y="42" class="sans panel-title">1 · Routed MoE: fuse the activation boundary and reuse routing</text>
    <text x="28" y="70" class="sans panel-sub">Nine selected experts per token; the expensive mistake is materializing and rediscovering handoff tensors.</text>
    <g transform="translate(30 103)">
      <rect width="176" height="86" rx="14" fill="#f5f5f4" stroke="#a8a29e"/>
      <text x="88" y="36" text-anchor="middle" class="sans node">top-k routing</text><text x="88" y="61" text-anchor="middle" class="sans small">row map + scales</text>
      <path d="M188 43h60" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="260" width="194" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="357" y="36" text-anchor="middle" class="sans node">gate/up MFMA</text><text x="357" y="61" text-anchor="middle" class="sans small">FP8 block scales</text>
      <path d="M466 43h60" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="538" width="244" height="86" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="660" y="27" text-anchor="middle" class="sans node">SiLU × up + FP8 quant</text><text x="660" y="51" text-anchor="middle" class="sans small">one launch · no BF16 round trip</text><text x="660" y="75" text-anchor="middle" class="sans metric">1.99×</text>
      <path d="M794 43h60" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="866" width="194" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="963" y="36" text-anchor="middle" class="sans node">down MFMA</text><text x="963" y="61" text-anchor="middle" class="sans small">same route order</text>
      <path d="M1072 43h60" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1144" width="190" height="86" rx="14" fill="#f5f5f4" stroke="#a8a29e"/>
      <text x="1239" y="36" text-anchor="middle" class="sans node">weighted reduce</text><text x="1239" y="61" text-anchor="middle" class="sans small">BF16 token output</text>
    </g>
  </g>

  <g transform="translate(64 466)">
    <rect width="1472" height="238" rx="22" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="28" y="42" class="sans panel-title">2 · Native FP8-KV attention: share by GQA group, split by sequence</text>
    <text x="28" y="70" class="sans panel-sub">Eight query heads share one KV head. Long prefixes are partitioned into independent online-softmax segments.</text>
    <g transform="translate(30 103)">
      <g>
        <rect width="212" height="86" rx="14" fill="#f5f5f4" stroke="#a8a29e"/>
        <text x="106" y="31" text-anchor="middle" class="sans node">Q₀ … Q₇</text><text x="106" y="59" text-anchor="middle" class="sans small">one GQA group</text>
      </g>
      <path d="M224 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="288" width="236" height="86" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="406" y="31" text-anchor="middle" class="sans node">load K/V once</text><text x="406" y="59" text-anchor="middle" class="sans small">native E4M3 + shared scales</text>
      <path d="M536 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <g transform="translate(600)">
        <rect width="142" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
        <rect x="154" width="142" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
        <rect x="308" width="142" height="86" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
        <text x="71" y="36" text-anchor="middle" class="sans node">segment 0</text><text x="71" y="61" text-anchor="middle" class="sans small">m, ℓ, O</text>
        <text x="225" y="36" text-anchor="middle" class="sans node">segment 1</text><text x="225" y="61" text-anchor="middle" class="sans small">m, ℓ, O</text>
        <text x="379" y="36" text-anchor="middle" class="sans node">segment n</text><text x="379" y="61" text-anchor="middle" class="sans small">m, ℓ, O</text>
      </g>
      <path d="M1062 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1126" width="208" height="86" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="1230" y="25" text-anchor="middle" class="sans node">stable merge</text><text x="1230" y="49" text-anchor="middle" class="sans small">global m, ℓ, O</text><text x="1230" y="75" text-anchor="middle" class="sans metric">2.21× / 4.38×</text>
    </g>
  </g>

  <g transform="translate(64 730)">
    <rect width="1472" height="238" rx="22" fill="#fff" stroke="#d6d3d1" stroke-width="2"/>
    <text x="28" y="42" class="sans panel-title">3 · Gated DeltaNet: keep recurrence local; write only live state</text>
    <text x="28" y="70" class="sans panel-sub">Verification needs token outputs now. Persistent state is committed only after the accepted prefix is known.</text>
    <g transform="translate(30 103)">
      <rect width="216" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="108" y="31" text-anchor="middle" class="sans node">QKVZ + conv</text><text x="108" y="59" text-anchor="middle" class="sans small">physical-stride kernel</text>
      <path d="M228 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="292" width="262" height="86" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="423" y="25" text-anchor="middle" class="sans node">K0 recurrent verify</text><text x="423" y="49" text-anchor="middle" class="sans small">FP32 state stays in registers/LDS</text><text x="423" y="75" text-anchor="middle" class="sans metric">−805 MiB dead writes</text>
      <path d="M566 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="630" width="226" height="86" rx="14" fill="#f5f5f4" stroke="#a8a29e"/>
      <text x="743" y="31" text-anchor="middle" class="sans node">token outputs</text><text x="743" y="59" text-anchor="middle" class="sans small">selection chooses prefix</text>
      <path d="M868 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="932" width="222" height="86" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
      <text x="1043" y="31" text-anchor="middle" class="sans node">state replay</text><text x="1043" y="59" text-anchor="middle" class="sans small">accepted tokens only</text>
      <path d="M1166 43h52" stroke="#a8a29e" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1230" width="170" height="86" rx="14" fill="#f5f5f4" stroke="#a8a29e"/>
      <text x="1315" y="31" text-anchor="middle" class="sans node">commit</text><text x="1315" y="59" text-anchor="middle" class="sans small">persistent state</text>
    </g>
  </g>
  <text x="800" y="1010" text-anchor="middle" class="sans note">Green marks the boundary that changed; gray paths remain explicit correctness and fallback contracts.</text>
</svg>
