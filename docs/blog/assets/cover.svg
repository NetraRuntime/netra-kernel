<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.6 inference on AMD MI350X at 81.33K output tokens per second</title>
  <desc id="desc">Editorial benchmark cover showing Netra Runtime serving Qwen3.6-35B on eight AMD Instinct MI350X GPUs with optimized SGLang.</desc>
  <rect width="1600" height="1000" fill="#f7f5f0"/>
  <path d="M0 118H1600M0 882H1600" stroke="#dedbd4" stroke-width="2"/>
  <g fill="#9a948a" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" letter-spacing="2">
    <text x="92" y="82">NETRA RUNTIME · ENGINEERING</text>
    <text x="1508" y="82" text-anchor="end">AMD INSTINCT MI350X</text>
  </g>
  <g transform="translate(92 192)">
    <text fill="#1c1917" font-family="Source Serif 4,Georgia,serif" font-size="82" font-weight="600">
      <tspan x="0" y="0">Qwen3.6 inference</tspan>
      <tspan x="0" y="96">on AMD MI350X</tspan>
    </text>
    <text x="0" y="222" fill="#57534e" font-family="Inter,Arial,sans-serif" font-size="29">Kernel-level optimization, SGLang data parallelism, and the path</text>
    <text x="0" y="263" fill="#57534e" font-family="Inter,Arial,sans-serif" font-size="29">from one complete GPU engine to an eight-GPU service.</text>
  </g>
  <g transform="translate(92 596)">
    <text fill="#0f766e" font-family="Inter,Arial,sans-serif" font-size="116" font-weight="750" letter-spacing="-5">81.33K</text>
    <text x="4" y="52" fill="#292524" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600">OUTPUT TOKENS / SECOND</text>
    <text x="4" y="104" fill="#78716c" font-family="Inter,Arial,sans-serif" font-size="23">Qwen3.6-35B-A3B-FP8 · 8× MI350X · 1K/1K</text>
  </g>
  <g transform="translate(1120 548)">
    <rect x="0" y="0" width="388" height="232" rx="22" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
    <g transform="translate(34 34)">
      <rect width="68" height="68" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
      <path d="M20 47V26h8v21zm14 0V17h8v30zm14 0V31h8v16z" fill="#0f766e"/>
      <text x="92" y="27" fill="#1c1917" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Optimized</text>
      <text x="92" y="57" fill="#57534e" font-family="Inter,Arial,sans-serif" font-size="21">SGLang + Netra</text>
    </g>
    <path d="M34 124H354" stroke="#e7e5e4" stroke-width="2"/>
    <g fill="#44403c" font-family="Inter,Arial,sans-serif" font-size="21">
      <text x="34" y="167">3.43× base SGLang</text>
      <text x="34" y="203">2.16× vLLM</text>
    </g>
  </g>
  <g transform="translate(92 926)" fill="#57534e" font-family="Inter,Arial,sans-serif" font-size="22">
    <text>ROCm · gfx950 · FP8 MoE · GDN · native FP8-KV attention</text>
    <text x="1416" text-anchor="end">AUGUST 22, 2026</text>
  </g>
</svg>
